[project]
name = "simedarby-hackathon"
version = "0.1.0"
description = "FastAPI + Neon Postgres + Native Rust Extension. For Sime Darby Hackathon."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.117",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1.4",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.2.1",
  "starter_rust",
]

[tool.uv.sources]
starter_rust = { path = "./rust_ext" }

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.6.9", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]
